RxJS Form example
<form>
  <input #c type="number" placeholder="c value"/>
  <input #d type="number" placeholder="d value"/>
  <button (click)="addition(c.valueAsNumber, d.valueAsNumber)" type="button">Addition</button>

  <h3>  Result: {{result}}</h3>
</form>
